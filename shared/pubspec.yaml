name: itsbits_shared
description: Client-agnostic Flutter components shared by the itsbits-flow
  frontends (profile state, profile screen, account dropdown, flags).
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
