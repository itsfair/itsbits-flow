# Production stack for the GLOBAL instance — one Docker network, no ports
# published except the ones clients/proxies need (Postgres/RustFS S3 are
# either meant for LAN clients or stay internal).
#
# Usage:
#   cp production.env.example production.env   # then fill in ALL values
#   docker compose -f docker-compose.production.yaml up -d
#
# The server applies pending DB migrations automatically at boot. On a
# fresh database it is created from migrations/<version>/definition.sql.
#
# Security expectations:
#   - Host-side TLS termination (reverse proxy, HTTPS) in front of the
#     API/web ports; the api Server addresses stay https in
#     config/production.yaml.
#   - 9000/9001 are LAN-only (never expose RustFS to the internet).
#   - Postgres is NOT published — only the stack's internal network.
#
# First start: create the first global admin account (register normally,
# then run tool/bootstrap_first_admin.sql once and sign in again).

services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: global
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database}
    volumes:
      - global_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global"]
      interval: 10s
      timeout: 5s
      retries: 10

  # File storage (S3 API on :9000, console on :9001). Credentials come
  # from production.env — ROTATE off the rustfsadmin dev defaults. The
  # SERVERPOD_RUSTFS_ENDPOINT value must be reachable by browsers/devices
  # too: presigned URLs travel inside API payloads.
  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    ports:
      - "${RUSTFS_S3_PORT:-9000}:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${SERVERPOD_RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${SERVERPOD_RUSTFS_SECRET_KEY}
    command: /data
    volumes:
      - global_prod_files:/data

  # One-shot bootstrap: creates the bucket PRIVATE (all reads presigned).
  create_buckets:
    image: minio/mc
    depends_on: [rustfs]
    entrypoint: '/bin/sh'
    command: >
      -c "
      until mc alias set fs http://rustfs:9000 $$RUSTFS_ACCESS_KEY $$RUSTFS_SECRET_KEY; do sleep 2; done;
      mc mb fs/itsbits-flow --ignore-existing;
      mc anonymous set none fs/itsbits-flow;
      exit 0;
      "
    environment:
      - RUSTFS_ACCESS_KEY=${SERVERPOD_RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${SERVERPOD_RUSTFS_SECRET_KEY}

  server:
    image: itsbits-flow-global-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "${SERVER_API_PORT:-8080}:8080"
      - "${SERVER_INSIGHTS_PORT:-8081}:8081"
      - "${SERVER_WEB_PORT:-8082}:8082"
    env_file:
      - production.env

volumes:
  global_prod_data:
  global_prod_files: