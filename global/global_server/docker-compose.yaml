services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: global
      POSTGRES_PASSWORD: "kZROkJKAJpEb6N6gtLts0SKanRkytXhQ"
    volumes:
      - global_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: global_test
      POSTGRES_PASSWORD: "9OZVkTZnWZYfO2nAXdW1qhwmfkNWe_Bg"
    volumes:
      - global_test_data:/var/lib/postgresql/data


  # File storage (RustFS, S3-compatible) for the global instance.
  # S3 API on :9000, web console on :9001 (login: rustfsadmin /
  # rustfsadmin_secret); the web console of the local workspace uses
  # 9101. The server resolves the S3 endpoint via the `rustFsEndpoint`
  # password (SERVERPOD_RUSTFS_ENDPOINT; see config/passwords.yaml).
  # Files live at deterministic paths (e.g. member_images/<id>.jpg).
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin_secret}
      - RUSTFS_CONSOLE_ENABLE=true
    command: /data
    volumes:
      - global_files:/data

  # One-shot bucket bootstrap: creates the bucket PRIVATE (display reads
  # go through presigned URLs, anonymous access is revoked). Credentials
  # must match the rustfs service above; values default to the dev pair
  # when no .env exists next to this compose file.
  create_buckets:
    image: minio/mc
    depends_on: [rustfs]
    entrypoint: '/bin/sh'
    command: >
      -c "
      until mc alias set fs http://rustfs:9000 $$RUSTFS_ACCESS_KEY $$RUSTFS_SECRET_KEY; do sleep 2; done;
      mc mb fs/itsbits-flow --ignore-existing;
      mc anonymous set none fs/itsbits-flow;
      exit 0;
      "
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin_secret}


volumes:
  global_data:
  global_test_data:
  global_files:

# The Serverpod server itself runs OUTSIDE this compose file (dev:
# `serverpod start`). SMTP credentials for the verification emails
# (registration / password reset) are passed to the server process via
# environment variables using Serverpod's built-in password override
# (SERVERPOD_PASSWORD_<key> mirrors config/passwords.yaml keys) — set
# them wherever the server process runs, e.g. its container env:
#   SERVERPOD_PASSWORD_smtpHost=smtp.example.com
#   SERVERPOD_PASSWORD_smtpPort=587
#   SERVERPOD_PASSWORD_smtpSsl=false
#   SERVERPOD_PASSWORD_smtpAllowInsecure=false
#   SERVERPOD_PASSWORD_smtpUsername=...
#   SERVERPOD_PASSWORD_smtpPassword=...
#   SERVERPOD_PASSWORD_smtpFromAddress=...
# Without smtpHost the codes are only logged (dev/test fallback).
