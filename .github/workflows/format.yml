name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [global/global_server, local/local_server]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting ${{ matrix.server }}
        working-directory: ${{ matrix.server }}
        run: dart format --set-exit-if-changed .
