services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8190:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: local
      POSTGRES_PASSWORD: "LpCqcZKF5zwd7uEB-rc_mDGZw0URhjK-"
    volumes:
      - local_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: local_test
      POSTGRES_PASSWORD: "jG8m_EY1HEYiz4PlUYQAV-YGh1sjuRdQ"
    volumes:
      - local_test_data:/var/lib/postgresql/data


volumes:
  local_data:
  local_test_data:
