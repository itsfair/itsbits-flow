services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8190:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: local
      POSTGRES_PASSWORD: "LpCqcZKF5zwd7uEB-rc_mDGZw0URhjK-"
    volumes:
      - local_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9190:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: local_test
      POSTGRES_PASSWORD: "jG8m_EY1HEYiz4PlUYQAV-YGh1sjuRdQ"
    volumes:
      - local_test_data:/var/lib/postgresql/data


  # File storage (RustFS, S3-compatible) for the local instance.
  # S3 API on :9200, web console on :9201 (login: rustfsadmin /
  # rustfsadmin_secret) — different host ports than the global workspace
  # (9000/9001) so both stacks can run simultaneously. NOTE: port 9100 is
  # deliberately avoided — Dart DevTools binds 9100 by default. The
  # server resolves the S3 endpoint via the `rustFsEndpoint` password
  # (SERVERPOD_RUSTFS_ENDPOINT; see config/passwords.yaml). Files live
  # at deterministic paths (e.g. member_images/<globalAuthUserId>.jpg).
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9200:9000"
      - "9201:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin_secret}
      - RUSTFS_CONSOLE_ENABLE=true
    command: /data
    volumes:
      - local_files:/data

  # One-shot bucket bootstrap: creates the bucket PRIVATE (display reads
  # go through presigned URLs, anonymous access is revoked). The local
  # bucket was previously never created; this service is idempotent
  # (--ignore-existing). Credentials must match the rustfs service above.
  create_buckets:
    image: minio/mc
    depends_on: [rustfs]
    entrypoint: '/bin/sh'
    command: >
      -c "
      until mc alias set fs http://rustfs:9000 $$RUSTFS_ACCESS_KEY $$RUSTFS_SECRET_KEY; do sleep 2; done;
      mc mb fs/itsbits-flow --ignore-existing;
      mc anonymous set none fs/itsbits-flow;
      exit 0;
      "
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin_secret}


volumes:
  local_data:
  local_test_data:
  local_files:
